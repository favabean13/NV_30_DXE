name: Build NvStrapsReBar GA102 20GB

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-22.04

    env:
      EDK2_VERSION: edk2-stable202402
      TARGET: RELEASE
      TARGET_ARCH: X64
      TOOL_CHAIN_TAG: GCC5

    steps:
      - name: Checkout NvStrapsReBar source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
          path: NvStrapsReBar

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            uuid-dev \
            acpica-tools \
            nasm \
            python3 \
            python3-pip \
            python3-distutils \
            git \
            libssl-dev \
            curl
          python3 -m pip install --user pefile

      - name: Clone EDK2 and replace the dead submodule
        run: |
          git clone --depth 1 --branch "${EDK2_VERSION}" https://github.com/tianocore/edk2.git edk2
          cd edk2

          # Fix the Subhook submodule URL used by this EDK2 revision.
          git submodule set-url UnitTestFrameworkPkg/Library/SubhookLib/subhook https://github.com/tianocore/edk2-subhook.git
          git submodule sync --recursive
          git submodule update --init --recursive
          git submodule status

      - name: Locate and verify NvStrapsReBar source files
        shell: bash
        run: |
          set -euo pipefail
          DSC_PATH="$(find NvStrapsReBar -type f -path '*/ReBarDxe/ReBar.dsc' -print -quit)"
          test -n "$DSC_PATH"
          DXE_DIR="${DSC_PATH%/ReBar.dsc}"
          test -f "$DXE_DIR/ReBarDxe.inf"
          test -f "$DXE_DIR/buildffs.py"
          test -f "$DXE_DIR/PciConfig.c"
          test -f "$DXE_DIR/include/PciConfig.h"
          test -f "$DXE_DIR/ReBar.c"
          echo "$DXE_DIR" > "$GITHUB_WORKSPACE/dxe-source-dir.txt"
          echo "Using DXE source directory: $DXE_DIR"

      - name: Add NvStrapsReBar DXE module to EDK2 tree
        shell: bash
        run: |
          set -euo pipefail
          DXE_DIR="$(cat dxe-source-dir.txt)"
          mkdir -p edk2/NvStrapsReBar
          cp -a "$DXE_DIR" edk2/NvStrapsReBar/ReBarDxe

          # Confirm the DSC references the expected module path.
          grep -q 'NvStrapsReBar/ReBarDxe/ReBarDxe.inf' edk2/NvStrapsReBar/ReBarDxe/ReBar.dsc

      - name: Verify Brotli sources are present
        run: |
          test -f edk2/BaseTools/Source/C/BrotliCompress/brotli/c/common/constants.h
          ls -R edk2/BaseTools/Source/C/BrotliCompress | head -n 50

      - name: Build BaseTools
        run: |
          make -C edk2/BaseTools -j"$(nproc)"
          test -f edk2/BaseTools/Source/C/bin/GenFfs
          test -f edk2/BaseTools/Source/C/bin/GenSec

      - name: Build NvStrapsReBar and package FFS
        working-directory: edk2
        shell: bash
        run: |
          set -euo pipefail
          source ./edksetup.sh
          python3 -m pip install --user pefile
          export PATH="$HOME/.local/bin:$PATH"
          python3 NvStrapsReBar/ReBarDxe/buildffs.py RELEASE B
          test -s Build/NvStrapsReBar/RELEASE_GCC5/X64/NvStrapsReBar.ffs
          test -s Build/NvStrapsReBar/RELEASE_GCC5/X64/NvStrapsReBar.efi

      - name: Copy build outputs
        run: |
          mkdir -p out
          cp edk2/Build/NvStrapsReBar/RELEASE_GCC5/X64/NvStrapsReBar.ffs out/
          cp edk2/Build/NvStrapsReBar/RELEASE_GCC5/X64/NvStrapsReBar.efi out/
          ls -lh out/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: NvStrapsReBar-GA102-20GB
          path: out/
          if-no-files-found: error
          retention-days: 14
